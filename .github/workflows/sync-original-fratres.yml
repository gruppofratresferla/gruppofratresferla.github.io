name: Pubblica il sito Fratres completo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-original-fratres.yml"

permissions:
  contents: write

concurrency:
  group: pubblica-sito-fratres
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Ricostruisci e verifica il sito
        shell: bash
        run: |
          set -euo pipefail

          archive="$(mktemp)"
          stage="$(mktemp -d)"
          trap 'rm -f -- "$archive"; rm -rf -- "$stage"' EXIT

          cat .sync-parts/part-* | base64 --decode > "$archive"
          printf '%s  %s\n'             '63ff03a288a0ef8c219deb7b4d3ed60ed25b9255d02a479fa786e19eba63b444'             "$archive" | sha256sum --check -

          tar -xJf "$archive" -C "$stage"

          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          checks = {
              "index.html": [
                  "Un piccolo gesto",
                  "gruppoferla@fratres.eu",
                  "JME4geaKC4E",
                  "logo-fratres-ufficiale.png",
              ],
              "calendario/index.html": ["Calendario"],
              "servizio-civile/index.html": ["Servizio Civile", "Graduatoria"],
          }

          for relative, needles in checks.items():
              file_path = root / relative
              if not file_path.is_file():
                  raise SystemExit(f"Pagina mancante: {relative}")
              text = file_path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"Contenuto mancante in {relative}: {needle}")

          for image_name in ("logo-fratres-ufficiale.png", "5x1000-fratres-ferla.png"):
              data = (root / image_name).read_bytes()
              if len(data) < 1024 or not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"Immagine non valida: {image_name}")

          if not list((root / "assets").glob("*.css")):
              raise SystemExit("Foglio di stile mancante")
          if not list((root / "assets").glob("*.js")):
              raise SystemExit("JavaScript mancante")
          PY

          printf '' > "$stage/.nojekyll"

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name ".sync-parts"             -exec rm -rf -- {} +

          cp -a "$stage"/. .

          printf '%s\n'             '# Gruppo Fratres “Sorriso” Ferla'             ''             'Sito ufficiale pubblicato su GitHub Pages.'             ''             '- Schermata di benvenuto e homepage responsive'             '- Logo ufficiale e immagine 5×1000 verificati'             '- Calendario donazioni annuale'             '- Servizio Civile: bando e graduatoria'             '- Contatti, social, e-mail e indirizzo aggiornati'             > README.md

      - name: Pubblica le modifiche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Il sito è già aggiornato."
            exit 0
          fi

          git commit -m "Pubblica la versione completa del sito Fratres"
          git push
