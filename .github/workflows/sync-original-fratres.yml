name: Sync original Fratres site

on:
  push:
    paths:
      - '.github/workflows/sync-original-fratres.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify original backup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="1f46f89d2dd8f99e60ff0839c42290910653e0367fe0eb6d9423eab33dbd9dcc"
          ARCHIVE="$RUNNER_TEMP/original-exact.tar.xz"
          B64="$RUNNER_TEMP/original-exact.b64"
          : > "$B64"
          for n in $(seq -w 0 21); do
            f=".sync-parts/part-$n"
            test -s "$f" || { echo "Manca $f"; exit 1; }
            tr -d '\r\n' < "$f" >> "$B64"
          done
          base64 --decode "$B64" > "$ARCHIVE"
          echo "$EXPECTED_SHA  $ARCHIVE" | sha256sum --check -

      - name: Extract verified original project
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/fratres-original"
          mkdir -p "$DEST"
          tar -xJf "$RUNNER_TEMP/original-exact.tar.xz" -C "$DEST"
          test -s "$DEST/index.html"
          test -s "$DEST/calendario/index.html"
          test -s "$DEST/calendario/2026/index.html"
          test -s "$DEST/servizio-civile/index.html"
          test -s "$DEST/logo-fratres-ufficiale.png"

      - name: Replace published files only after verification
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/fratres-original"
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          cp -a "$DEST"/. .

      - name: Commit synchronized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fratres Ferla Site Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Il repository è già allineato."
            exit 0
          fi
          git commit -m "Pubblica il progetto Fratres originale verificato"
          git push origin HEAD:main
